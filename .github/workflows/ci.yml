name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: "Run only these test files (space-separated) on windows-latest, Node 24"
        required: false
        default: ""

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tests == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.13.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF on Windows checkouts; the product still accepts CRLF in users' own files.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # tests/dashboard-installed drives the packed dashboard in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:overhead
      - run: npm run test:package

  focused:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tests != '' }}
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # The input reaches the shell only through the environment, never interpolated into the script.
      - shell: pwsh
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          $files = $env:TESTS -split '\s+' | Where-Object { $_ }
          node scripts/test.mjs @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: pwsh
        run: |
          $left = Get-ChildItem $env:TEMP -Filter 'raw-test-run-*' -ErrorAction SilentlyContinue
          if ($left) { $left | ForEach-Object { $_.FullName }; exit 1 }
